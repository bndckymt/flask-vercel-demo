<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | FlowTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✓</span> FlowTask</a>
        </header>

        <section class="panel auth-panel">
            <div class="auth-heading">
                <h1>Welcome back</h1>
                <p>Log in to pick up where you left off.</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="alert" role="alert">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form class="auth-form" method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text"
                           maxlength="50" autocomplete="username"
                           placeholder="Your username" required autofocus>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password"
                           placeholder="Your password" required>
                </div>

                <button class="add-button" type="submit">Log in</button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </p>
        </section>
    </main>
</body>
</html>
